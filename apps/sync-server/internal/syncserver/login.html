<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Nomi</title>
  <style nonce="{{.Nonce}}">
    :root { color-scheme: light dark; --bg: #fff; --ink: #202020; --muted: #737373; --fill: #f5f5f5; --line: #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171717; --ink: #eee; --muted: #a0a0a0; --fill: #252525; --line: #393939; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100svh; display: grid; place-items: center; padding: 28px; }
    main { width: 100%; max-width: 340px; }
    h1 { font-size: 26px; font-weight: 550; letter-spacing: -.5px; margin: 0 0 24px; }
    label { display: grid; gap: 7px; font-size: 13px; margin-top: 18px; }
    input { width: 100%; padding: 11px 12px; background: var(--fill); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font: inherit; }
    input:focus { outline: 2px solid var(--muted); outline-offset: 2px; }
    button, .button { display: block; width: 100%; padding: 11px 16px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; text-align: center; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { opacity: .85; }
    p { color: var(--muted); font-size: 13px; }
    .error { margin-bottom: 20px; }
    .providers { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 8px; }
    .providers button { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
    .providers img, .providers svg { height: 20px; flex: none; }
  </style>
</head>
<body>
  <main>
    {{if .Return}}
      <h1>You’re signed in.</h1>
      <p>Continue in the Nomi app.</p>
      <a class="button" href="{{.Return}}">Open Nomi</a>
      <script nonce="{{.Nonce}}">location.href={{.Return}};</script>
    {{else}}
      <h1>Sign in to Nomi</h1>
      {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
      {{if .Request}}
        <form action="/login" method="post">
          <input type="hidden" name="request" value="{{.Request}}">
          <input type="hidden" name="csrf" value="{{.CSRF}}">
          <label>Email<input type="email" name="email" autocomplete="username" required autofocus maxlength="254"></label>
          <label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="72"></label>
          <button type="submit">Sign in</button>
        </form>
        {{if or .Google .Apple}}
          <form class="providers" action="/login" method="post">
            <input type="hidden" name="request" value="{{.Request}}">
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            {{if .Google}}
              <button name="provider" value="google">
                <img src="{{googleLogo}}" width="20" height="20" alt="">
                Continue with Google
              </button>
            {{end}}
            {{if .Apple}}
              <button name="provider" value="apple">
                <svg aria-hidden="true" focusable="false" width="18" height="20" viewBox="7 10 17 20" fill="currentColor">
                  <path d="M15.7099491,14.8846154 C16.5675461,14.8846154 17.642562,14.3048315 18.28274,13.5317864 C18.8625238,12.8312142 19.2852829,11.852829 19.2852829,10.8744437 C19.2852829,10.7415766 19.2732041,10.6087095 19.2490464,10.5 C18.2948188,10.5362365 17.1473299,11.140178 16.4588366,11.9494596 C15.9152893,12.56548 15.4200572,13.5317864 15.4200572,14.5222505 C15.4200572,14.6671964 15.4442149,14.8121424 15.4562937,14.8604577 C15.5166879,14.8725366 15.6133185,14.8846154 15.7099491,14.8846154 Z M12.6902416,29.5 C13.8618881,29.5 14.3812778,28.714876 15.8428163,28.714876 C17.3285124,28.714876 17.6546408,29.4758423 18.9591545,29.4758423 C20.2395105,29.4758423 21.0971074,28.292117 21.9063891,27.1325493 C22.8123013,25.8038779 23.1867451,24.4993643 23.2109027,24.4389701 C23.1263509,24.4148125 20.6743484,23.4122695 20.6743484,20.5979021 C20.6743484,18.1579784 22.6069612,17.0588048 22.7156707,16.974253 C21.4353147,15.1382708 19.490623,15.0899555 18.9591545,15.0899555 C17.5217737,15.0899555 16.3501271,15.9596313 15.6133185,15.9596313 C14.8161157,15.9596313 13.7652575,15.1382708 12.521138,15.1382708 C10.1536872,15.1382708 7.75,17.0950413 7.75,20.7911634 C7.75,23.0861411 8.64383344,25.513986 9.74300699,27.0842339 C10.6851558,28.4129053 11.5065162,29.5 12.6902416,29.5 Z"/>
                </svg>
                Continue with Apple
              </button>
            {{end}}
          </form>
        {{end}}
      {{end}}
    {{end}}
  </main>
</body>
</html>
