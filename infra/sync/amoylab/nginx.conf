# Existing certificate remains managed by Certbot. Only this hostname is changed.
server {
    listen 443 ssl;
    server_name nomi.ifuryst.com;
    ssl_certificate /etc/letsencrypt/live/nomi.ifuryst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nomi.ifuryst.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        # Trailing slash removes /api/; Go keeps its versioned /v1/ routes.
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    # Reserved for the future public website; no authenticated API at the root.
    location / {
        root /var/www/nomi-site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80;
    server_name nomi.ifuryst.com;
    return 301 https://nomi.ifuryst.com$request_uri;
}
