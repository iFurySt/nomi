name: Server 发布

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ifuryst/nomi-server

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/iFurySt/nomi
            org.opencontainers.image.description=Nomi Go API server

      - name: 构建并推送 server 镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 配置 SSH
        env:
          AMOYLAB_SSH_KEY: ${{ secrets.AMOYLAB_SSH_KEY }}
          AMOYLAB_SSH_KNOWN_HOSTS: ${{ secrets.AMOYLAB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${AMOYLAB_SSH_KEY}"
          test -n "${AMOYLAB_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AMOYLAB_SSH_KEY}" > ~/.ssh/nomi_amoylab
          chmod 600 ~/.ssh/nomi_amoylab
          printf '%s\n' "${AMOYLAB_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 部署到 amoylab
        env:
          AMOYLAB_SSH_HOST: ${{ secrets.AMOYLAB_SSH_HOST }}
          AMOYLAB_SSH_PORT: ${{ secrets.AMOYLAB_SSH_PORT }}
          AMOYLAB_SSH_USER: ${{ secrets.AMOYLAB_SSH_USER }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AMOYLAB_SSH_HOST}"
          test -n "${AMOYLAB_SSH_PORT}"
          test -n "${AMOYLAB_SSH_USER}"
          printf '%s' "${GHCR_TOKEN}" | ssh \
            -i ~/.ssh/nomi_amoylab \
            -p "${AMOYLAB_SSH_PORT}" \
            "${AMOYLAB_SSH_USER}@${AMOYLAB_SSH_HOST}" \
            ghcr-login-and-deploy
          ssh \
            -i ~/.ssh/nomi_amoylab \
            -p "${AMOYLAB_SSH_PORT}" \
            "${AMOYLAB_SSH_USER}@${AMOYLAB_SSH_HOST}" \
            health
