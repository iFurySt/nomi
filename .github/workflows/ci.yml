name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run base CI checks
        run: ./scripts/ci.sh

  sync-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/sync-server/go.mod
          cache-dependency-path: apps/sync-server/go.sum
      - name: Isolated PostgreSQL sync integration tests
        run: ./scripts/test-sync-server.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync contract and durable queue tests
        run: pnpm exec vitest run packages/core/src/sync packages/host/src/sync-engine.test.ts packages/host/src/sync-recovery.test.ts packages/host/src/sync-client.test.ts
      - name: Native package and paired backup restore
        run: node scripts/check-sync-package.mjs --backup
